<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenPAL4 Web (Wasm + WebGL2) &amp; Headless agent-pal4 Console</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1017;
      --panel: #151c28;
      --border: #263248;
      --accent: #38bdf8;
      --ok: #34d399;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 1fr 420px;
      height: 100vh;
    }
    main {
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    canvas {
      width: 100%;
      flex: 1;
      background: #05070b;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    aside {
      border-left: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow-y: auto;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button, label.file-btn {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover, label.file-btn:hover {
      border-color: var(--accent);
    }
    pre {
      margin: 0;
      padding: 12px;
      background: #090d14;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.45;
      overflow-x: auto;
      flex: 1;
    }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <strong>OpenPAL4 Web Runtime</strong>
        <span style="color: var(--muted); margin-left: 8px;">C++20 ChapterHost &rarr; Emscripten Wasm + WebGL2 + WORKERFS</span>
      </div>
      <div class="btn-row">
        <a href="./replay.html#replay" style="background:#0284c7;color:#fff;border:1px solid #38bdf8;border-radius:6px;padding:8px 12px;text-decoration:none;font-size:13px;font-weight:600;">🎬 打开 Web 交互式回放器与排行榜</a>
        <label class="file-btn">
          挂载本地 PAL4 目录 (.cpk)
          <input id="cpk-dir" type="file" webkitdirectory directory multiple />
        </label>
        <button id="btn-trial">启动内置 3D 石沉溪洞无头试炼</button>
      </div>
    </header>
    <canvas id="pal4-canvas" width="1280" height="720"></canvas>
  </main>
  <aside>
    <strong>agent-pal4 JSON-RPC 控制器</strong>
    <div class="btn-row">
      <button data-rpc='{"cmd":"observe"}'>Observe</button>
      <button data-rpc='{"cmd":"move_to","x":35,"y":0,"z":0,"max_steps":120}'>寻路 &rarr; 韩菱纱</button>
      <button data-rpc='{"cmd":"interact"}'>Interact / 对话确认</button>
      <button data-rpc='{"cmd":"move_to","x":-40,"y":0,"z":25,"max_steps":180}'>寻路 &rarr; 猎弓木匣</button>
      <button data-rpc='{"cmd":"move_to","x":0,"y":0,"z":-65,"max_steps":180}'>寻路 &rarr; 洞口机关</button>
      <button data-rpc='{"cmd":"switch_leader","index":1}'>切换领队: 韩菱纱</button>
    </div>
    <pre id="telemetry">等待 Wasm Worker 或本地无头宿主连接...</pre>
  </aside>
  <script type="module">
    const telemetry = document.getElementById('telemetry');
    const canvas = document.getElementById('pal4-canvas');
    const offscreen = canvas.transferControlToOffscreen ? canvas.transferControlToOffscreen() : null;
    const worker = new Worker('./pal4-worker.js', { type: 'module' });

    worker.onmessage = (e) => {
      telemetry.textContent = JSON.stringify(e.data, null, 2);
    };

    if (offscreen) {
      worker.postMessage({ type: 'init_canvas', canvas: offscreen }, [offscreen]);
    }

    document.getElementById('cpk-dir').addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      worker.postMessage({ type: 'mount_local_cpk', files });
    });

    document.getElementById('btn-trial').addEventListener('click', () => {
      worker.postMessage({ type: 'rpc', payload: { cmd: 'reset' } });
    });

    for (const btn of document.querySelectorAll('button[data-rpc]')) {
      btn.addEventListener('click', () => {
        worker.postMessage({ type: 'rpc', payload: JSON.parse(btn.dataset.rpc) });
      });
    }
  </script>
</body>
</html>
